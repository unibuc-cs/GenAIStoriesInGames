; Live proposal source configuration.
; Copy this file to LLMConfig.ini (same folder) and fill in your values.
; LLMConfig.ini is gitignored -- never commit an API key.

[LLM]
; Any OpenAI-compatible chat-completions endpoint works, including local
; servers:
;   OpenAI:    https://api.openai.com/v1/chat/completions
;   Ollama:    http://localhost:11434/v1/chat/completions
;   LM Studio: http://localhost:1234/v1/chat/completions
Endpoint=https://api.openai.com/v1/chat/completions

; Leave empty for local servers that need no key.
ApiKey=

; Model name as the endpoint expects it (e.g. gpt-4o-mini, llama3.1:8b).
Model=gpt-4o-mini

Temperature=0.7

; Some local servers reject OpenAI's response_format field; set to False
; if you get HTTP 400 errors.
JsonResponseFormat=True
